<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFR 2026 - Ultimate Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* VIDEO HERO */
.hero{
position:relative;
height:100vh;
overflow:hidden;
}

.hero video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.4);
}

.hero-content{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:4rem;
font-weight:900;
letter-spacing:-1px;
}

.hero p{
opacity:.8;
margin-top:10px;
}

.btn{
margin-top:30px;
padding:15px 40px;
background:#fff;
color:#000;
border-radius:50px;
text-decoration:none;
font-weight:700;
transition:.3s;
}
.btn:hover{transform:scale(1.1);}

/* SCROLL FADE */
.reveal{
opacity:0;
transform:translateY(60px);
transition:1s;
}
.reveal.active{
opacity:1;
transform:translateY(0);
}

/* SECTION */
section{padding:100px 20px;text-align:center;}
.container{max-width:1100px;margin:auto;}

/* COUNTDOWN */
.countdown{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}
.time{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:10px;
}

/* CARD */
.cards{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}
.card{
padding:50px;
width:240px;
background:linear-gradient(135deg,#00e5ff,#8b5cf6);
border-radius:20px;
cursor:pointer;
transition:.4s;
}
.card:hover{
transform:scale(1.08);
}

/* PARALLAX */
.parallax{
background:url('poster.jpg') center/cover fixed;
height:400px;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}
.gallery img{
width:100%;
border-radius:10px;
}

/* FAQ */
.faq-item{margin:10px 0;}
.faq-answer{display:none;}
.faq-item.active .faq-answer{display:block;}

/* SPONSOR */
.sponsor{
display:flex;
gap:40px;
justify-content:center;
flex-wrap:wrap;
}
.sponsor img{height:50px;opacity:.7;}

/* WA */
.wa{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50px;
color:#fff;
text-decoration:none;
}

/* CURSOR GLOW */
.cursor{
position:fixed;
width:20px;
height:20px;
background:#00e5ff;
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
mix-blend-mode:difference;
}
</style>
</head>

<body>

<div class="cursor"></div>

<!-- HERO VIDEO -->
<section class="hero">
<video autoplay muted loop>
<source src="hero.mp4" type="video/mp4">
</video>

<div class="hero-content">
<h1>BFR 2026</h1>
<p>Ultimate Running Experience</p>
<a href="#kategori" class="btn">JOIN NOW</a>
</div>
</section>

<!-- COUNTDOWN -->
<section class="reveal">
<h2>Countdown</h2>
<div class="countdown">
<div class="time"><h3 id="d">00</h3>Hari</div>
<div class="time"><h3 id="h">00</h3>Jam</div>
<div class="time"><h3 id="m">00</h3>Menit</div>
<div class="time"><h3 id="s">00</h3>Detik</div>
</div>
</section>

<!-- PARALLAX -->
<div class="parallax"></div>

<!-- CATEGORY -->
<section id="kategori" class="reveal">
<h2>Kategori</h2>
<div class="cards">
<div class="card" onclick="go()">5K RUN</div>
<div class="card" onclick="go()">10K RUN</div>
</div>
</section>

<!-- GALLERY -->
<section class="reveal">
<h2>Galeri</h2>
<div class="gallery">
<img src="galeri1.jpg">
<img src="galeri2.jpg">
<img src="galeri3.jpg">
<img src="galeri4.jpg">
</div>
</section>

<!-- FAQ -->
<section class="reveal">
<h2>FAQ</h2>
<div class="faq-item">
<div class="faq-q">Cara daftar?</div>
<div class="faq-answer">Klik tombol lalu chat admin</div>
</div>
</section>

<!-- SPONSOR -->
<section class="reveal">
<h2>Sponsor</h2>
<div class="sponsor">
<img src="sponsor1.png">
<img src="sponsor2.png">
<img src="sponsor3.png">
<img src="sponsor4.png">
</div>
</section>

<a href="https://wa.me/628217003017" class="wa">Chat</a>

<script>
// COUNTDOWN
let t=new Date("2026-07-05T05:30:00+07:00").getTime();
setInterval(()=>{
let n=Date.now(),d=t-n;
dEl.innerHTML=Math.floor(d/86400000);
h.innerHTML=Math.floor((d%86400000)/3600000);
m.innerHTML=Math.floor((d%3600000)/60000);
s.innerHTML=Math.floor((d%60000)/1000);
},1000);

// REVEAL
window.addEventListener("scroll",()=>{
document.querySelectorAll(".reveal").forEach(el=>{
if(el.getBoundingClientRect().top<window.innerHeight-100){
el.classList.add("active");
}
});
});

// FAQ
document.querySelectorAll(".faq-item").forEach(i=>{
i.onclick=()=>i.classList.toggle("active");
});

// CURSOR
document.addEventListener("mousemove",e=>{
document.querySelector(".cursor").style.left=e.clientX+"px";
document.querySelector(".cursor").style.top=e.clientY+"px";
});

// REDIRECT
function go(){
window.location.href="https://zonamerahmarsyal-creator.github.io/BANTUL-RUN-2026/";
}
</script>

</body>
</html>
