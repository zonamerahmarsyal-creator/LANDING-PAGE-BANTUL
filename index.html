<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFR 2026 - Official Event</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#000;
}

/* VIDEO FIX (FULL TANPA CROP) */
.hero video{
width:100%;
max-height:100vh;
object-fit:contain;
background:#000;
}

/* CONTENT */
.hero-content{
position:absolute;
text-align:center;
}
.hero h1{font-size:3rem;font-weight:800;}
.hero p{opacity:.8;margin-top:10px;}

.btn{
margin-top:20px;
padding:12px 30px;
background:#fff;
color:#000;
border-radius:40px;
text-decoration:none;
font-weight:600;
}

/* SECTION */
section{padding:80px 20px;text-align:center;}
.container{max-width:1100px;margin:auto;}

/* GLASS */
.glass{
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:40px;
}

/* COUNTDOWN */
.countdown{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}
.time{
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:10px;
}

/* CARD */
.cards{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}
.card{
padding:40px;
width:200px;
background:linear-gradient(135deg,#00e5ff,#8b5cf6);
border-radius:20px;
cursor:pointer;
}

/* PARALLAX */
.parallax{
background:url('poster.jpg') center/cover;
height:300px;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}
.gallery img{width:100%;border-radius:10px;}

/* FAQ */
.faq-item{margin:10px 0;}
.faq-answer{display:none;}
.faq-item.active .faq-answer{display:block;}

/* SPONSOR */
.sponsor{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}
.sponsor img{height:40px;}

/* WA */
.wa{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:12px;
border-radius:50px;
color:#fff;
text-decoration:none;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<video autoplay muted loop>
<source src="hero.mp4" type="video/mp4">
</video>

<div class="hero-content">
<h1>BFR 2026</h1>
<p>Ultimate Running Experience</p>
<a href="#kategori" class="btn">Daftar</a>
</div>

</section>

<!-- COUNTDOWN -->
<section>
<div class="container glass">
<h2>Countdown</h2>
<div class="countdown">
<div class="time"><h3 id="d">00</h3>Hari</div>
<div class="time"><h3 id="h">00</h3>Jam</div>
<div class="time"><h3 id="m">00</h3>Menit</div>
<div class="time"><h3 id="s">00</h3>Detik</div>
</div>
</div>
</section>

<!-- PARALLAX -->
<div class="parallax"></div>

<!-- CATEGORY -->
<section id="kategori">
<h2>Kategori</h2>
<div class="cards">
<div class="card" onclick="go()">5K RUN</div>
<div class="card" onclick="go()">10K RUN</div>
</div>
</section>

<!-- GALLERY -->
<section>
<h2>Galeri</h2>
<div class="gallery">
<img src="galeri1.jpg">
<img src="galeri2.jpg">
<img src="galeri3.jpg">
<img src="galeri4.jpg">
</div>
</section>

<!-- FAQ -->
<section>
<h2>FAQ</h2>
<div class="faq-item">
<div onclick="this.parentElement.classList.toggle('active')">Cara daftar?</div>
<div class="faq-answer">Klik kategori lalu chat admin</div>
</div>
</section>

<!-- SPONSOR -->
<section>
<h2>Sponsor</h2>
<div class="sponsor">
<img src="sponsor1.png">
<img src="sponsor2.png">
<img src="sponsor3.png">
</div>
</section>

<footer style="padding:30px;text-align:center;">
© 2026 BFR
</footer>

<a href="https://wa.me/628217003017" class="wa">Chat</a>

<script>
// COUNTDOWN
let t=new Date("2026-07-05T05:30:00+07:00").getTime();
setInterval(()=>{
let n=Date.now(),d=t-n;
dEl.innerHTML=Math.floor(d/86400000);
h.innerHTML=Math.floor((d%86400000)/3600000);
m.innerHTML=Math.floor((d%3600000)/60000);
s.innerHTML=Math.floor((d%60000)/1000);
},1000);

// REDIRECT
function go(){
window.location.href="https://zonamerahmarsyal-creator.github.io/BANTUL-RUN-2026/";
}
</script>

</body>
</html>
